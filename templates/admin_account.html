<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #1683e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .success {
            background: #e5f7e9;
            color: #176b2c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            text-decoration: none;
            color: #1683e8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Admin Account</h1>
    <div class="subtitle">
        Update your administrator username and password.
    </div>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <form method="POST">

        <label>Current Password</label>
        <input
            type="password"
            name="current_password"
            required
        >

        <label>New Username</label>
        <input
            type="text"
            name="username"
            value="{{ admin.username }}"
            required
        >

        <label>New Password</label>
        <input
            type="password"
            name="new_password"
            required
        >

        <label>Confirm New Password</label>
        <input
            type="password"
            name="confirm_password"
            required
        >

        <button type="submit">
            Update Account
        </button>

    </form>

    <a href="{{ url_for('dashboard') }}" class="back">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
