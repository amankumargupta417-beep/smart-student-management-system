<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Parent - Smart Student Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #198754;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #146c43;
        }

        .back {
            display: inline-block;
            background: #343a40;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
        }

        .back:hover {
            background: #23272b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add Parent</h1>

    <p class="subtitle">
        Create a parent account and link it with a student.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label for="full_name">Parent Name</label>
        <input
            type="text"
            id="full_name"
            name="full_name"
            placeholder="Enter parent full name"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter parent username"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <label for="student_id">Select Student</label>
        <select id="student_id" name="student_id" required>

            <option value="">-- Select Student --</option>

            {% for student in students %}
                <option value="{{ student.id }}">
                    {{ student.full_name }} - Roll No: {{ student.roll_no }}
                </option>
            {% endfor %}

        </select>

        {% if not students %}
            <p style="color:#b00020;">
                No students found. Please add a student first.
            </p>
        {% endif %}

        <div class="buttons">
            <button type="submit">+ Add Parent</button>

            <a href="{{ url_for('admin_parents') }}" class="back">
                ← Back to Parents
            </a>
        </div>

    </form>

</div>

</body>
</html>
